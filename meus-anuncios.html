<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#087fba" />
    <meta
      name="description"
      content="Ajude um animal a encontrar o caminho de casa. Anúncios de animais perdidos e encontrados no iPet."
    />
    <title>iPet — Todo reencontro começa com uma ajuda</title>
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <a class="skip" href="#conteudo">Pular para o conteúdo</a>
    <header id="header"></header>
    <main id="conteudo">
      <section class="container section">
        <div class="page-heading-actions">
          <div>
            <div class="eyebrow">VAMOS PROCURAR JUNTOS</div>
            <h1 class="page-title">Quem você está procurando?</h1>
            <p class="subtitle">
              Explore as pistas. O reencontro pode estar mais perto do que você
              imagina.
            </p>
          </div>
          <a class="button" href="publicar.html">⊕ Criar anúncio</a>
        </div>
        <div id="demo-notice"></div>
        <form id="filters" class="filter-panel">
          <div class="filter-main">
            <label
              >Cor ou raça<input
                name="q"
                type="text"
                value=""
                maxlength="150"
                placeholder="Ex.: caramelo ou SRD" /></label
            ><label
              >Cidade ou bairro<select name="local">
                <option value="">Selecione</option>
                <option value="Águas Claras">Águas Claras</option>
                <option value="Água Quente">Água Quente</option>
                <option value="Arapoanga">Arapoanga</option>
                <option value="Arniqueira">Arniqueira</option>
                <option value="Brazlândia">Brazlândia</option>
                <option value="Candangolândia">Candangolândia</option>
                <option value="Ceilândia">Ceilândia</option>
                <option value="Cruzeiro">Cruzeiro</option>
                <option value="Fercal">Fercal</option>
                <option value="Gama">Gama</option>
                <option value="Guará">Guará</option>
                <option value="Itapoã">Itapoã</option>
                <option value="Jardim Botânico">Jardim Botânico</option>
                <option value="Lago Norte">Lago Norte</option>
                <option value="Lago Sul">Lago Sul</option>
                <option value="Núcleo Bandeirante">Núcleo Bandeirante</option>
                <option value="Paranoá">Paranoá</option>
                <option value="Park Way">Park Way</option>
                <option value="Planaltina">Planaltina</option>
                <option value="Plano Piloto">Plano Piloto</option>
                <option value="Recanto das Emas">Recanto das Emas</option>
                <option value="Riacho Fundo">Riacho Fundo</option>
                <option value="Riacho Fundo II">Riacho Fundo II</option>
                <option value="Samambaia">Samambaia</option>
                <option value="Santa Maria">Santa Maria</option>
                <option value="São Sebastião">São Sebastião</option>
                <option value="SCIA/Estrutural">SCIA/Estrutural</option>
                <option value="SIA">SIA</option>
                <option value="Sobradinho">Sobradinho</option>
                <option value="Sobradinho II">Sobradinho II</option>
                <option value="Sol Nascente/Pôr do Sol">Sol Nascente/Pôr do Sol</option>
                <option value="Sudoeste/Octogonal">Sudoeste/Octogonal</option>
                <option value="Taguatinga">Taguatinga</option>
                <option value="Varjão">Varjão</option>
                <option value="Vicente Pires">Vicente Pires</option>
              </select></label
            ><label
              >Situação<select name="tipo">
                <option value="perdido">Perdido</option>
                <option value="encontrado">Encontrado</option>
              </select></label
            ><button class="button">Buscar</button>
          </div>
          <details>
            <summary>Mais filtros</summary>
            <div class="form-grid">
              <label
                >Espécie<select name="especie">
                  <option value="">Todos</option>
                  <option>Cachorro</option>
                  <option>Gato</option>
                  <option>Ave</option>
                  <option>Outro</option>
                </select></label
              ><label
                >Raça<input
                  name="raca"
                  type="text"
                  value=""
                  maxlength="150" /></label
              ><label
                >Cor<input
                  name="cor"
                  type="text"
                  value=""
                  maxlength="150" /></label
              ><label
                >Porte<select name="porte">
                  <option value="">Todos</option>
                  <option>Pequeno</option>
                  <option>Médio</option>
                  <option>Grande</option>
                </select></label
              ><label
                >Sexo<select name="sexo">
                  <option value="">Todos</option>
                  <option>Macho</option>
                  <option>Fêmea</option>
                  <option>Não identificado</option>
                </select></label
              ><label
                >Data da ocorrência<input
                  name="data"
                  type="date"
                  value=""
                  maxlength="150" /></label
              ><label
                >Status<select name="status">
                  <option value="ativo">Ativos</option>
                  <option value="resolvido">Resolvidos</option>
                  <option value="">Todos</option>
                </select></label
              >
            </div>
          </details>
          <button class="text-button" type="reset">Limpar filtros</button>
        </form>
        <p id="count" class="result-count" role="status">
          Carregando anúncios…
        </p>
        <div id="cards" class="cards"></div>
      </section>
    </main>
    <footer id="footer"></footer>
    <noscript>Ative o JavaScript para navegar nos anúncios do iPet.</noscript>
  </body>
</html>
