<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#087fba" />
    <meta
      name="description"
      content="Ajude um animal a encontrar o caminho de casa. Anúncios de animais perdidos e encontrados no iPet."
    />
    <title>iPet — Todo reencontro começa com uma ajuda</title>
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <a class="skip" href="#conteudo">Pular para o conteúdo</a>
    <header id="header"></header>
    <main id="conteudo">
      <section class="container section form-container">
        <a class="back" href="anuncios.html">← Voltar aos anúncios</a>
        <div class="eyebrow">UMA INFORMAÇÃO PODE FAZER A DIFERENÇA</div>
        <h1 class="page-title">Publicar anúncio</h1>
        <p class="subtitle">
          Conte o que sabe sobre o animal. Os campos com * são obrigatórios.
        </p>
        <div id="demo-notice"></div>
        <form id="publish-form" class="panel">
          <fieldset>
            <legend>O que aconteceu? *</legend>
            <div class="type-options">
              <label
                ><input type="radio" name="tipo" value="perdido" required />
                Perdi um animal</label
              ><label
                ><input type="radio" name="tipo" value="encontrado" required />
                Encontrei um animal</label
              >
            </div>
          </fieldset>
          <h2 class="small-title">1. Sobre o animal</h2>
          <div class="form-grid">
            <label
              >Nome, se conhecido<input
                name="nome_animal"
                type="text"
                value=""
                maxlength="150" /></label
            ><label
              >Espécie *<select name="especie" required>
                <option value="">Selecione</option>
                <option>Cachorro</option>
                <option>Gato</option>
                <option>Ave</option>
                <option>Outro</option>
              </select></label
            ><label
              >Raça<input
                name="raca"
                type="text"
                value=""
                list="racas-cachorro"
                autocomplete="off"
                maxlength="150" /></label
            ><label
              >Cor<input
                name="cor"
                type="text"
                value=""
                maxlength="150" /></label
            ><label
              >Porte<select name="porte">
                <option value="">Não informado</option>
                <option>Pequeno</option>
                <option>Médio</option>
                <option>Grande</option>
              </select></label
            ><label
              >Sexo<select name="sexo">
                <option value="">Não informado</option>
                <option>Macho</option>
                <option>Fêmea</option>
                <option>Não identificado</option>
              </select></label
            >
          </div>
          <datalist id="racas-cachorro">
            <option value="Akita"></option>
            <option value="American Bully"></option>
            <option value="Basset Hound"></option>
            <option value="Beagle"></option>
            <option value="Bichon Frisé"></option>
            <option value="Border Collie"></option>
            <option value="Boxer"></option>
            <option value="Bulldog Francês"></option>
            <option value="Bulldog Inglês"></option>
            <option value="Cane Corso"></option>
            <option value="Chihuahua"></option>
            <option value="Chow Chow"></option>
            <option value="Cocker Spaniel"></option>
            <option value="Dachshund"></option>
            <option value="Dálmata"></option>
            <option value="Dobermann"></option>
            <option value="Fila Brasileiro"></option>
            <option value="Golden Retriever"></option>
            <option value="Husky Siberiano"></option>
            <option value="Labrador Retriever"></option>
            <option value="Lhasa Apso"></option>
            <option value="Maltês"></option>
            <option value="Pastor Alemão"></option>
            <option value="Pastor Australiano"></option>
            <option value="Pinscher"></option>
            <option value="Pit Bull"></option>
            <option value="Poodle"></option>
            <option value="Pug"></option>
            <option value="Rottweiler"></option>
            <option value="Samoieda"></option>
            <option value="Schnauzer"></option>
            <option value="Sem raça definida (SRD)"></option>
            <option value="Shih Tzu"></option>
            <option value="Spitz Alemão"></option>
            <option value="Staffordshire Bull Terrier"></option>
            <option value="Weimaraner"></option>
            <option value="Yorkshire Terrier"></option>
          </datalist>
          <label
            >Descrição *<textarea
              name="descricao"
              required
              maxlength="3000"
              rows="4"
              placeholder="Como é o animal? Como aconteceu?"
            ></textarea></label
          ><label
            >Características marcantes<input
              name="caracteristicas"
              type="text"
              value=""
              maxlength="150" /></label
          ><label class="upload"
            >Foto do animal *<input
              type="file"
              name="foto"
              accept="image/jpeg,image/png,image/webp"
              required /><small
              >Uma foto por anúncio nesta primeira versão. JPG, PNG ou WebP, até
              5 MB.</small
            ><img
              id="preview"
              class="preview"
              alt="Prévia da foto selecionada"
              hidden
          /></label>
          <h2 class="small-title">2. Quando e onde?</h2>
          <div class="form-grid">
            <label
              >Data da ocorrência *<input
                name="data_ocorrencia"
                type="date"
                value=""
                required
                maxlength="150" /></label
            ><label
              >Cidade *<input
                name="cidade"
                type="text"
                value=""
                list="cidades-df"
                autocomplete="off"
                required
                maxlength="150" /></label
            ><label
              >Bairro *<input
                name="bairro"
                type="text"
                value=""
                list="bairros-df"
                autocomplete="off"
                required
                maxlength="150" /></label
            ><label
              >Ponto de referência<input
                name="referencia"
                type="text"
                value=""
                maxlength="150"
            /></label>
          </div>
          <datalist id="cidades-df">
            <option value="Brasília"></option>
            <option value="Águas Claras"></option>
            <option value="Água Quente"></option>
            <option value="Arapoanga"></option>
            <option value="Arniqueira"></option>
            <option value="Brazlândia"></option>
            <option value="Candangolândia"></option>
            <option value="Ceilândia"></option>
            <option value="Cruzeiro"></option>
            <option value="Fercal"></option>
            <option value="Gama"></option>
            <option value="Guará"></option>
            <option value="Itapoã"></option>
            <option value="Jardim Botânico"></option>
            <option value="Lago Norte"></option>
            <option value="Lago Sul"></option>
            <option value="Núcleo Bandeirante"></option>
            <option value="Paranoá"></option>
            <option value="Park Way"></option>
            <option value="Planaltina"></option>
            <option value="Plano Piloto"></option>
            <option value="Recanto das Emas"></option>
            <option value="Riacho Fundo"></option>
            <option value="Riacho Fundo II"></option>
            <option value="Samambaia"></option>
            <option value="Santa Maria"></option>
            <option value="São Sebastião"></option>
            <option value="SCIA/Estrutural"></option>
            <option value="SIA"></option>
            <option value="Sobradinho"></option>
            <option value="Sobradinho II"></option>
            <option value="Sol Nascente/Pôr do Sol"></option>
            <option value="Sudoeste/Octogonal"></option>
            <option value="Taguatinga"></option>
            <option value="Varjão"></option>
            <option value="Vicente Pires"></option>
          </datalist>
          <datalist id="bairros-df">
            <option value="Águas Claras Norte"></option>
            <option value="Águas Claras Sul"></option>
            <option value="Areal"></option>
            <option value="Asa Norte"></option>
            <option value="Asa Sul"></option>
            <option value="Ceilândia Norte"></option>
            <option value="Ceilândia Sul"></option>
            <option value="Cruzeiro Novo"></option>
            <option value="Cruzeiro Velho"></option>
            <option value="Gama Leste"></option>
            <option value="Gama Oeste"></option>
            <option value="Granja do Torto"></option>
            <option value="Guará I"></option>
            <option value="Guará II"></option>
            <option value="Jardins Mangueiral"></option>
            <option value="Lúcio Costa"></option>
            <option value="Noroeste"></option>
            <option value="Octogonal"></option>
            <option value="P Norte"></option>
            <option value="P Sul"></option>
            <option value="Pôr do Sol"></option>
            <option value="Samambaia Norte"></option>
            <option value="Samambaia Sul"></option>
            <option value="Santa Maria Norte"></option>
            <option value="Santa Maria Sul"></option>
            <option value="Setor O"></option>
            <option value="Sobradinho I"></option>
            <option value="Sobradinho II"></option>
            <option value="Sol Nascente"></option>
            <option value="Sudoeste"></option>
            <option value="Taguatinga Centro"></option>
            <option value="Taguatinga Norte"></option>
            <option value="Taguatinga Sul"></option>
            <option value="Vila Planalto"></option>
          </datalist>
          <h2 class="small-title">3. Como entrar em contato?</h2>
          <label
            >Telefone, e-mail ou outra forma de contato *<input
              name="contato"
              type="text"
              value=""
              required
              maxlength="200" /></label
          ><label class="checkbox"
            ><input type="checkbox" name="consentimento" required /> Autorizo a
            exibição pública do contato informado neste anúncio.</label
          >
          <p class="form-message" role="status"></p>
          <button class="button" disabled>Publicar anúncio ↗</button>
        </form>
      </section>
    </main>
    <footer id="footer"></footer>
    <noscript>Ative o JavaScript para navegar nos anúncios do iPet.</noscript>
  </body>
</html>
